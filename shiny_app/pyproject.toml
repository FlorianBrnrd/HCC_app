[project]
name = "hcc-app-shiny"
version = "0.1.0"
description = "HCC Explorer: Shiny for Python app for exploring C. elegans cell clusters by gene or tissue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.0",  # needed by shinywidgets to render plotly >= 6 figures
    "colorcet>=3.2.1",
    "ipyaggrid>=0.5.4",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shiny>=1.7.0",
    "shinywidgets>=0.8.1",
]
